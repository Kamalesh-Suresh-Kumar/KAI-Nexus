
name: KAI-NEXUS Live Website QA

on:
  workflow_dispatch:

  # Run after GitHub Pages deployment completes
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kai-nexus-live-qa
  cancel-in-progress: false

jobs:
  live-cross-browser-qa:
    name: Live QA - Chromium, Firefox, WebKit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: kai-nexus-live-qa

    env:
      CI: true
      BASE_URL: https://kamalesh-suresh-kumar.github.io/KAI-Nexus/

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha ||
            github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kai-nexus-live-qa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run live cross-browser tests
        run: npx playwright test

      - name: Upload Playwright HTML report and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-nexus-live-qa-report
          path: |
            kai-nexus-live-qa/playwright-report/
            kai-nexus-live-qa/test-results/
          retention-days: 14
          if-no-files-found: warn