
name: KAI-NEXUS Live Website QA

on:
  workflow_dispatch:

  # Run daily at 8:00 AM IST
  schedule:
    - cron: "30 2 * * *"

  # Run whenever the QA test harness or workflow changes
  push:
    paths:
      - "kai-nexus-live-qa/**"
      - ".github/workflows/live-qa.yml"

permissions:
  contents: read

concurrency:
  group: kai-nexus-live-qa
  cancel-in-progress: true

jobs:
  live-cross-browser-qa:
    name: Live QA - Chromium, Firefox, WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: kai-nexus-live-qa

    env:
      CI: true
      BASE_URL: https://kamalesh-suresh-kumar.github.io/KAI-Nexus/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kai-nexus-live-qa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run live cross-browser tests
        run: npx playwright test

      - name: Upload Playwright HTML report and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-nexus-live-qa-report
          path: |
            kai-nexus-live-qa/playwright-report/
            kai-nexus-live-qa/test-results/
          retention-days: 14
          if-no-files-found: warn